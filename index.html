<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Money Tracker</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--mut:#6b7280;--line:#e8ebf2;--blue:#1d4ed8;--blueb:#e6f0ff;--red:#c62828;--redb:#fdeaea;--green:#188038;--greenb:#e4f5e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.pill{background:#e4f5e8;color:var(--green);font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.stat{border-radius:14px;padding:14px 16px}
.stat label{font-size:13px;font-weight:700;letter-spacing:.04em;display:block;margin-bottom:6px}
.stat .v{font-size:28px;font-weight:700}
.stat input{font:inherit;font-size:28px;font-weight:700;color:inherit;background:transparent;border:0;border-bottom:2px dashed currentColor;width:100%;outline:none;padding:0}
.a{background:var(--blueb);color:var(--blue)}.s{background:var(--redb);color:var(--red)}.b{background:var(--greenb);color:var(--green)}.b.neg{background:var(--redb);color:var(--red)}
.warn{background:#fff4e0;border:1px solid #ffd699;color:#8a5200;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
select,input,textarea{font:inherit;padding:9px 11px;border:1px solid #d6dbe6;border-radius:10px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid #d6dbe6;background:#fff;padding:9px 14px;color:var(--ink)}
button.p{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
button.sm{padding:4px 9px;font-size:13px}button.d{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:680px}
th{text-align:left;padding:10px 8px;border-bottom:2px solid var(--line);font-size:13px}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.r{text-align:right}.mut{color:var(--mut)}.wk td{background:#fafbfe}
.bar{height:9px;border-radius:9px;background:#eef1f7;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.form{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:440px;display:grid;gap:10px}
.form label{font-size:13px;color:var(--mut);display:grid;gap:4px}
.err{color:var(--red);font-size:13px}
@media(max-width:700px){.cards,.grid2{grid-template-columns:1fr}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const CATS = ["Food","Transport","Shopping","Bills","Health","Entertainment","Other"];
const STORE = "money-tracker-v1";
const pad = n => String(n).padStart(2, "0");
const mkey = (y, m) => y + "-" + pad(m + 1);
const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function load() {
  try { const d = JSON.parse(localStorage.getItem(STORE)); if (d && d.budgets && d.expenses) return d; } catch (e) {}
  return { budgets: {}, expenses: [] };
}

function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

function ExpenseForm({ initial, onSave, onClose }) {
  const [f, setF] = useState({ date: initial.date, description: initial.description || "", category: initial.category || "Food", amount: initial.amount || "", notes: initial.notes || "" });
  const [err, setErr] = useState("");
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const submit = () => {
    const amt = parseFloat(f.amount);
    if (!f.date) return setErr("Please choose a date.");
    if (!f.description.trim()) return setErr("Description is required.");
    if (!(amt > 0)) return setErr("Amount must be greater than 0.");
    onSave({ id: initial.id || uid(), date: f.date, description: f.description.trim(), category: f.category, amount: amt, notes: f.notes.trim() });
  };
  return (
    <div className="modal" onClick={onClose}>
      <div className="form" onClick={e => e.stopPropagation()}>
        <h2>{initial.id ? "Edit expense" : "Add expense"}</h2>
        <label>Date<input type="date" value={f.date} onChange={set("date")} /></label>
        <label>Description<input value={f.description} onChange={set("description")} placeholder="e.g. Lunch" autoFocus /></label>
        <label>Category<select value={f.category} onChange={set("category")}>{CATS.map(c => <option key={c}>{c}</option>)}</select></label>
        <label>Amount (₹)<input type="number" min="0" step="0.01" value={f.amount} onChange={set("amount")} /></label>
        <label>Notes<textarea rows="2" value={f.notes} onChange={set("notes")} /></label>
        {err && <div className="err">{err}</div>}
        <div className="row" style={{ justifyContent: "flex-end" }}>
          <button onClick={onClose}>Cancel</button>
          <button className="p" onClick={submit}>Save</button>
        </div>
      </div>
    </div>
  );
}

function DailyChart({ days, byDay }) {
  const vals = Array.from({ length: days }, (_, i) => byDay[i + 1] || 0);
  const max = Math.max(...vals, 1), w = 600 / days;
  return (
    <svg viewBox="0 0 600 150" style={{ width: "100%" }}>
      {vals.map((v, i) => {
        const h = (v / max) * 110;
        return (
          <g key={i}>
            <rect x={i * w + 1} y={120 - h} width={Math.max(w - 2, 1)} height={h} rx="2" fill="#1d4ed8"><title>{"Day " + (i + 1) + ": " + inr(v)}</title></rect>
            {(i + 1) % 5 === 0 || i === 0 ? <text x={i * w + w / 2} y="140" fontSize="10" textAnchor="middle" fill="#6b7280">{i + 1}</text> : null}
          </g>
        );
      })}
    </svg>
  );
}

function App() {
  const now = new Date();
  const [data, setData] = useState(load);
  const [month, setMonth] = useState(now.getMonth());
  const [year, setYear] = useState(now.getFullYear());
  const [q, setQ] = useState("");
  const [modal, setModal] = useState(null);

  useEffect(() => { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) {} }, [data]);

  const key = mkey(year, month);
  const budget = data.budgets[key] || 0;
  const monthExp = useMemo(() => data.expenses.filter(e => e.date.startsWith(key)), [data, key]);
  const spend = monthExp.reduce((s, e) => s + e.amount, 0);
  const balance = budget - spend;
  const low = budget > 0 && balance >= 0 && balance < budget * 0.2;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const byDay = {}, byCat = {};
  monthExp.forEach(e => { const d = +e.date.slice(8); byDay[d] = (byDay[d] || 0) + e.amount; byCat[e.category] = (byCat[e.category] || 0) + e.amount; });

  const term = q.trim().toLowerCase();
  const match = e => !term || [e.description, e.category, e.notes, String(e.amount)].join(" ").toLowerCase().includes(term);

  const setBudget = v => setData(d => ({ ...d, budgets: { ...d.budgets, [key]: Math.max(0, parseFloat(v) || 0) } }));
  const save = ex => {
    setData(d => ({ ...d, expenses: d.expenses.some(e => e.id === ex.id) ? d.expenses.map(e => e.id === ex.id ? ex : e) : [...d.expenses, ex] }));
    // jump to the month of the saved expense so the user sees it
    setYear(+ex.date.slice(0, 4)); setMonth(+ex.date.slice(5, 7) - 1); setModal(null);
  };
  const del = id => { if (confirm("Delete this expense?")) setData(d => ({ ...d, expenses: d.expenses.filter(e => e.id !== id) })); };

  const sorted = [...monthExp].sort((a, b) => a.date.localeCompare(b.date));
  const exportCSV = () => {
    const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
    const rows = [["Date", "Description", "Category", "Amount", "Notes"], ...sorted.map(e => [e.date, e.description, e.category, e.amount, e.notes])];
    download("expenses-" + key + ".csv", rows.map(r => r.map(esc).join(",")).join("\n"), "text/csv");
  };
  const exportXLS = () => {
    const t = "<table border='1'><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Notes</th></tr>" +
      sorted.map(e => "<tr><td>" + e.date + "</td><td>" + e.description.replace(/</g, "&lt;") + "</td><td>" + e.category + "</td><td>" + e.amount + "</td><td>" + e.notes.replace(/</g, "&lt;") + "</td></tr>").join("") + "</table>";
    download("expenses-" + key + ".xls", "<html><head><meta charset='utf-8'></head><body>" + t + "</body></html>", "application/vnd.ms-excel");
  };

  const rows = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const date = key + "-" + pad(d);
    const dow = new Date(year, month, d).getDay();
    const list = monthExp.filter(e => e.date === date && match(e));
    const label = pad(d) + " " + MONTHS[month].slice(0, 3);
    if (!list.length) {
      if (!term) rows.push(<tr key={date} className={dow === 0 || dow === 6 ? "wk" : ""}><td>{label}</td><td>{DAYS[dow]}</td><td className="mut" colSpan="5">No expenses <button className="sm" onClick={() => setModal({ date })}>+ Add</button></td></tr>);
    } else list.forEach((e, i) => rows.push(
      <tr key={e.id} className={dow === 0 || dow === 6 ? "wk" : ""}>
        <td>{i === 0 ? label : ""}</td><td>{i === 0 ? DAYS[dow] : ""}</td>
        <td>{e.description}</td><td>{e.category}</td><td className="r">{inr(e.amount)}</td><td className="mut">{e.notes}</td>
        <td style={{ whiteSpace: "nowrap" }}><button className="sm" onClick={() => setModal(e)}>Edit</button> <button className="sm d" onClick={() => del(e.id)}>Delete</button></td>
      </tr>));
  }

  const years = []; for (let y = now.getFullYear() - 5; y <= now.getFullYear() + 5; y++) years.push(y);
  const defDate = (year === now.getFullYear() && month === now.getMonth()) ? key + "-" + pad(now.getDate()) : key + "-01";
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

  return (
    <div className="wrap">
      <div className="panel">
        <div className="row between"><h1>My Money Tracker</h1><span className="pill">Monthly overview</span></div>
        <div className="cards">
          <div className="stat a"><label>ACTUAL (BUDGET)</label>
            <input key={key} type="number" min="0" defaultValue={budget || ""} placeholder="₹0" onBlur={e => setBudget(e.target.value)} onKeyDown={e => e.key === "Enter" && e.target.blur()} aria-label="Monthly budget" />
            <div style={{ fontSize: 12, marginTop: 4 }}>{inr(budget)} · tap to edit</div></div>
          <div className="stat s"><label>SPEND</label><div className="v">{inr(spend)}</div></div>
          <div className={"stat b" + (balance < 0 ? " neg" : "")}><label>BALANCE</label><div className="v">{inr(balance)}</div></div>
        </div>
        {balance < 0 && <div className="warn">⚠️ Over budget by {inr(-balance)} this month.</div>}
        {low && <div className="warn">⚠️ Low balance: less than 20% of your budget is left ({inr(balance)}).</div>}
        <div className="row between" style={{ marginBottom: 10 }}>
          <h2>Select Month</h2><span className="pill" style={{ background: "#eef1f7", color: "#14213d" }}>{MONTHS[month]} {year}</span>
        </div>
        <div className="row">
          <select value={month} onChange={e => setMonth(+e.target.value)} aria-label="Month">{MONTHS.map((m, i) => <option key={m} value={i}>{m}</option>)}</select>
          <select value={year} onChange={e => setYear(+e.target.value)} aria-label="Year">{years.map(y => <option key={y}>{y}</option>)}</select>
        </div>
      </div>

      <div className="grid2">
        <div className="panel"><h2 style={{ marginBottom: 8 }}>Daily spending</h2><DailyChart days={daysInMonth} byDay={byDay} /></div>
        <div className="panel"><h2 style={{ marginBottom: 8 }}>Category breakdown</h2>
          {!cats.length && <div className="mut">No expenses this month.</div>}
          {cats.map(([c, v]) => (
            <div key={c} style={{ marginBottom: 8 }}>
              <div className="row between" style={{ fontSize: 14 }}><span>{c}</span><span>{inr(v)} · {Math.round(v / spend * 100)}%</span></div>
              <div className="bar"><i style={{ width: (v / spend * 100) + "%" }} /></div>
            </div>))}
        </div>
      </div>

      <div className="panel">
        <div className="row between" style={{ marginBottom: 10 }}>
          <h2>Daily expenses</h2>
          <div className="row">
            <input type="search" placeholder="Search expenses…" value={q} onChange={e => setQ(e.target.value)} />
            <button onClick={exportCSV}>CSV</button><button onClick={exportXLS}>Excel</button>
            <button className="p" onClick={() => setModal({ date: defDate })}>+ Add Expense</button>
          </div>
        </div>
        <div className="tw"><table>
          <thead><tr><th>Date</th><th>Day</th><th>Description</th><th>Category</th><th className="r">Amount</th><th>Notes</th><th>Actions</th></tr></thead>
          <tbody>{rows.length ? rows : <tr><td colSpan="7" className="mut">No matching expenses.</td></tr>}</tbody>
        </table></div>
      </div>
      {modal && <ExpenseForm initial={modal} onSave={save} onClose={() => setModal(null)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
